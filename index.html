<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Video Maker</title>
<style>
body {
  background: #111827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
.box {
  background: #263449;
  padding: 20px;
  border-radius: 15px;
}
button {
  background: #16a34a;
  color: white;
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  margin: 10px;
}
#result {
  background: #374151;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<div class="box">
<h1>🪙 Funny Video Maker 😂</h1>
<h2>₹1 Rupee Funny Video</h2>
<p>अपना मजेदार वीडियो स्क्रिप्ट बनाओ!</p>

<button onclick="makeVideo()">
वीडियो बनाओ 😂
</button>

<div id="result">
यहाँ आपकी स्क्रिप्ट आएगी।
</div>
</div>

<script>
function makeVideo() {
document.getElementById("result").innerText =
"🪙 सिक्का: मुझे छोटा मत समझना!\n\n"+
"👦 लड़का: तू सिर्फ ₹1 का है!\n\n"+
"🪙 सिक्का: लेकिन तेरी किस्मत बदल सकता हूँ! 😂\n\n"+
"🤣 Like और Subscribe करो!";
}
</script>

</body>
</html>
